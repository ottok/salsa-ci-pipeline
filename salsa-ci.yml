.test-piuparts: &test-piuparts
  stage: test
  image: $SALSA_CI_IMAGES_PIUPARTS
  rules:
    - if: $SALSA_CI_ENABLE_PIUPARTS =~ /^(1|yes|true)$/
    - if: $SALSA_CI_DISABLE_ALL_TESTS =~ /^(1|yes|true)$/
      when: never
    - if: $SALSA_CI_DISABLE_PIUPARTS !~ /^(1|yes|true)$/
  script:
    - *mmdebstrap-config-script
    - test -n "${SALSA_CI_PIUPARTS_PRE_INSTALL_SCRIPT}" && cp -aTLv "${SALSA_CI_PIUPARTS_PRE_INSTALL_SCRIPT}" /etc/piuparts/scripts/pre_install_salsa_ci && chmod 755 /etc/piuparts/scripts/pre_install_salsa_ci
    - test -n "${SALSA_CI_PIUPARTS_POST_INSTALL_SCRIPT}" && cp -aTLv "${SALSA_CI_PIUPARTS_POST_INSTALL_SCRIPT}" /etc/piuparts/scripts/post_install_salsa_ci && chmod 755 /etc/piuparts/scripts/post_install_salsa_ci
    - cd  ${WORKING_DIR}
    - apt-ftparchive packages . > Packages
    # Mark the local test repository as the target release so apt-get -t does
    # not deprioritize test-deb dependencies.
    - apt-ftparchive -o APT::FTPArchive::Release::Suite="${RELEASE}" release . > Release
    # Ensure the generated metadata satisfies the apt-get -t invariant.
    - 'grep -qFx "Suite: ${RELEASE}" Release'
    # passwd is needed for useradd in /etc/piuparts/scripts/post_setup_dummy_users
    - |
      PIUPARTS_BASE_TAR="${WORKING_DIR}/piuparts-base.tar"
      MMDEBSTRAP_PIUPARTS_BASE_COMMAND="mmdebstrap \
        --skip=output/dev \
        --variant=apt \
        --include=passwd,eatmydata \
        --components=\"${MMDEBSTRAP_COMPONENTS}\" \
        ${MMDEBSTRAP_SETUP_HOOK_ARGS} \
        ${MMDEBSTRAP_CUSTOMIZE_HOOK_ARGS} \
        ${SALSA_CI_MMDEBSTRAP_EXTRA_ARGS} \
        --setup-hook=\"add_extra_repository.sh -v -e \\\"${SALSA_CI_EXTRA_REPOSITORY}\\\" -k \\\"${SALSA_CI_EXTRA_REPOSITORY_KEY}\\\" -s \\\"${SALSA_CI_EXTRA_REPOSITORY_SOURCES}\\\" -t \\\"\\\$1/etc\\\"\" \
        ${mmdebstrap_dist} \
        ${PIUPARTS_BASE_TAR} \
        ${SALSA_CI_MIRROR}"
      sh -c "${MMDEBSTRAP_PIUPARTS_BASE_COMMAND}"
      # Avoid piuparts remapping moving aliases with stale distro information.
      PIUPARTS_KEEP_SOURCES_LIST=
      if [ "${mmdebstrap_dist}" = "${RELEASE}" ]; then
        PIUPARTS_KEEP_SOURCES_LIST=--keep-sources-list
      fi
    - piuparts ${SALSA_CI_PIUPARTS_ARGS} --scriptsdir=/etc/piuparts/scripts
      --allow-database --warn-on-leftovers-after-purge --distribution=$RELEASE --basetgz="${PIUPARTS_BASE_TAR}"
      ${PIUPARTS_KEEP_SOURCES_LIST}
      --single-packages --single-changes-list --distupgrade-to-testdebs-from ${WORKING_DIR}
      --mirror="${SALSA_CI_MIRROR} ${MMDEBSTRAP_COMPONENTS}"
      --log-file=/tmp/piuparts.log ${WORKING_DIR}/*.changes
    # we can't move the log earlier as piuparts would detect it and fail
    - mv /tmp/piuparts.log ${WORKING_DIR}/piuparts.log
  variables:
    # To make the repository available in this job,
    # so SALSA_CI_PIUPARTS_{PRE,POST}_INSTALL_SCRIPT
    # can refer to committed scripts
    GIT_STRATEGY: fetch
  artifacts:
    when: always
    paths:
      - ${WORKING_DIR}/piuparts.log
  needs:
    - job: build
      artifacts: true

