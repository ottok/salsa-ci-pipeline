.test-missing-breaks: &test-missing-breaks
  stage: test
  image: $SALSA_CI_IMAGES_GENERIC_TESTS
  rules:
    - if: $SALSA_CI_ENABLE_MISSING_BREAKS =~ /^(1|yes|true)$/
    - if: $SALSA_CI_DISABLE_ALL_TESTS =~ /^(1|yes|true)$/
      when: never
    - if: $SALSA_CI_DISABLE_MISSING_BREAKS !~ /^(1|yes|true)$/
  script:
    - add_extra_repository.sh -v
      -e "${SALSA_CI_EXTRA_REPOSITORY}" -k "${SALSA_CI_EXTRA_REPOSITORY_KEY}"
      -s "${SALSA_CI_EXTRA_REPOSITORY_SOURCES}"
    - apt-get update
    - echo "$NOTICE_MESSAGE"
    - |
      case "$RELEASE" in
        # NOTE: Releases with devscripts >= 2.25.10 update this list as needed
        experimental|unstable|trixie|questing|resolute)
          eatmydata apt-get install --no-install-recommends -y devscripts
          deb-check-file-conflicts -o ${WORKING_DIR}/missing_breaks.xml --changes-file ${WORKING_DIR}/*.changes
          ;;
        *)
          check_for_missing_breaks_replaces.py -o ${WORKING_DIR}/missing_breaks.xml --changes-file ${WORKING_DIR}/*.changes
          ;;
      esac
  artifacts:
    reports:
      junit: ${WORKING_DIR}/missing_breaks.xml
  variables:
    GIT_STRATEGY: none
    NOTICE_MESSAGE: |
      ***********************************************************************************************************
      NOTICE! The Salsa CI job 'missing-breaks' has been enabled by default for all pipelines on March 1st, 2025.

      The job is temporarily in 'allow_failures' mode until March 31st, 2025, to give maintainers time to notice
      that the new job exists, review the results before and fix issues before if affects the pipeline status.
      ***********************************************************************************************************
  needs:
    - job: build
      artifacts: true
  # @TODO: Remove this and the NOTICE_MESSAGE on March 31st, 2025:
  allow_failure: true

.test-wrap-and-sort: &test-wrap-and-sort
  stage: test
  image: ${SALSA_CI_IMAGES}/generic_tests:unstable
  rules:
    - if: $SALSA_CI_ENABLE_WRAP_AND_SORT =~ /^(1|yes|true)$/
    - if: $SALSA_CI_DISABLE_ALL_TESTS =~ /^(1|yes|true)$/
      when: never
    - if: $SALSA_CI_DISABLE_WRAP_AND_SORT !~ /^(1|yes|true)$/
  script:
    - apt-get update && eatmydata apt-get install --no-install-recommends -y devscripts
    - mkdir -v ${CI_BUILDS_DIR}/control
    - mkdir -v ${CI_BUILDS_DIR}/wrap-and-sort
    - cp -av debian/ ${CI_BUILDS_DIR}/control/
    - cp -av debian/ ${CI_BUILDS_DIR}/wrap-and-sort/
    - (cd ${CI_BUILDS_DIR}/wrap-and-sort && wrap-and-sort ${SALSA_CI_WRAP_AND_SORT_ARGS})
    - diff -ur ${CI_BUILDS_DIR}/control/debian/ ${CI_BUILDS_DIR}/wrap-and-sort/debian/
  variables:
    GIT_STRATEGY: fetch
  needs: []

.test-licenserecon: &test-licenserecon
  stage: test
  image: ${SALSA_CI_IMAGES}/generic_tests:unstable
  rules:
    - if: $SALSA_CI_ENABLE_LICENSERECON =~ /^(1|yes|true)$/
    - if: $SALSA_CI_DISABLE_ALL_TESTS =~ /^(1|yes|true)$/
      when: never
    - if: $SALSA_CI_DISABLE_LICENSERECON !~ /^(1|yes|true)$/
  script:
    - apt-get update && eatmydata apt-get install --no-install-recommends -y licenserecon
    - lrc ${SALSA_CI_LICENSERECON_ARGS}
  variables:
    GIT_STRATEGY: fetch
  needs: []

.setup_chdist: &setup_chdist
  - apt-get update && eatmydata apt-get install --no-install-recommends -y distro-info
  - CHDIST_NAME="archive-${RELEASE}"
  - |
    STABLE="$(distro-info --stable)"
    OLDSTABLE="$(distro-info --oldstable)"
    CHDIST_COMPONENTS="${SALSA_CI_COMPONENTS:-main}"
    EXTRAS=""

    case "$RELEASE" in
      experimental)
        BASE="unstable"
        EXTRAS="experimental"
        ;;
      *-backports)
        BASE="${RELEASE%-backports}"   # strip suffix
        EXTRAS="${BASE}-updates ${BASE}-security ${BASE}-backports"
        ;;
      *)
        BASE="$RELEASE"
        # for (old)stable codenames, include updates/security
        if [ "$BASE" = "$STABLE" ] || [ "$BASE" = "$OLDSTABLE" ]; then
          EXTRAS="${BASE}-updates ${BASE}-security"
        fi
        ;;
    esac

    chdist create "$CHDIST_NAME" "$SALSA_CI_MIRROR" "$BASE" $CHDIST_COMPONENTS

    for SUITE in $EXTRAS; do
      REPO="$SALSA_CI_MIRROR"
      case "$SUITE" in
        *-security)
          type=security
          REPO="$SALSA_CI_SECURITY_MIRROR"
          ;;
        *-updates)
          type=updates
          ;;
        *-backports)
          type=backports
          ;;
        experimental)
          type=experimental
          ;;
      esac

      cat > "${HOME}/.chdist/${CHDIST_NAME}/etc/apt/sources.list.d/${type}.list" <<EOF
    deb ${REPO} ${SUITE} ${CHDIST_COMPONENTS}
    deb-src ${REPO} ${SUITE} ${CHDIST_COMPONENTS}
    EOF
    done
  - chdist "$CHDIST_NAME" apt-get update

.test-debdiff: &test-debdiff
  stage: test
  image: ${SALSA_CI_IMAGES}/generic_tests:unstable
  rules:
    - if: $SALSA_CI_DISABLE_ALL_TESTS =~ /^(1|yes|true)$/
      when: never
    - if: $SALSA_CI_DISABLE_DEBDIFF =~ /^(1|yes|true)$/
      when: never
    - if: $SALSA_CI_ENABLE_DEBDIFF =~ /^(1|yes|true)$/
  script:
    - apt-get update && eatmydata apt-get install colordiff devscripts dpkg-dev distro-info --no-install-recommends -y
    - DEBDIFF_ARTIFACT="debian/output/${CI_PROJECT_NAME}.debdiff"
    - DEBDIFF_FILENAME="${CI_PROJECT_DIR}/${DEBDIFF_ARTIFACT}"
    - mkdir -vp "$(dirname "$DEBDIFF_FILENAME")"
    - CURRENT_BUILD_DSC=$(find "$WORKING_DIR" -maxdepth 1 -name '*.dsc' -print -quit)
    - |
      if [ -z "$CURRENT_BUILD_DSC" ]; then
        echo "Error: no source package (.dsc) found in ${WORKING_DIR}."
        exit 1
      fi
    - PACKAGE_NAME=$(grep '^Source:' "$CURRENT_BUILD_DSC" | awk '{print $2}')
    - PACKAGE_ARCHIVE_PATH="${WORKING_DIR}/package_archive_files"
    - *setup_chdist
    - mkdir -vp "$PACKAGE_ARCHIVE_PATH"
    - cd "$PACKAGE_ARCHIVE_PATH"
    - |
      if ! chdist apt-get "$CHDIST_NAME" source --download-only "$PACKAGE_NAME"; then
        echo "No source package named ${PACKAGE_NAME} found in the ${RELEASE} archive."
        : > "$DEBDIFF_FILENAME"
        exit 0
      fi
    - cd "$CI_PROJECT_DIR"
    - ARCHIVE_DSC=$(find "$PACKAGE_ARCHIVE_PATH" -maxdepth 1 -name '*.dsc' -print -quit)
    - debdiff "$ARCHIVE_DSC" "$CURRENT_BUILD_DSC" > "$DEBDIFF_FILENAME" || true
    - |
      if [ -s "$DEBDIFF_FILENAME" ]; then
        colordiff < "$DEBDIFF_FILENAME"
      else
        echo "No differences found between archive and current source package."
      fi
  artifacts:
    paths:
      - "debian/output/${CI_PROJECT_NAME}.debdiff"
    when: always
  variables:
    GIT_STRATEGY: none
  needs:
    - job: build source
      artifacts: true
  allow_failure: true

.generate-build-rdep-config: &generate-build-rdep-config
  stage: test
  image: $SALSA_CI_IMAGES_BUILD
  rules:
    - if: $SALSA_CI_ENABLE_BUILD_REVERSE_DEPENDENCIES =~ /^(1|yes|true)$/
    - if: $SALSA_CI_DISABLE_ALL_TESTS =~ /^(1|yes|true)$/
      when: never
    - if: $SALSA_CI_DISABLE_BUILD_REVERSE_DEPENDENCIES !~ /^(1|yes|true)$/
  variables:
    GIT_STRATEGY: fetch
  script:
    - cat /usr/share/salsa-ci/build-rdeps-template.yml >> ${WORKING_DIR}/build-rdeps-config.yml
    - *setup_chdist
    - |
      ratt -skip_ftbfs \
        -sbuild-keep-build-log \
        -direct-rdeps \
        -dry_run -json \
        -dist "$RELEASE" \
        -chdist "$CHDIST_NAME" \
        ${WORKING_DIR}/*.changes > /tmp/ratt_dry.json

      RDEP_COUNT="$(jq -r '.reverse_dep_count' /tmp/ratt_dry.json 2>/dev/null)"

      if [ "$RDEP_COUNT" -eq 0 ]; then
        echo "Package has no reverse build-dependencies."
        exit 1
      fi

      MAX_RDEP_LIMIT=100

      if [ "$RDEP_COUNT" -gt "$MAX_RDEP_LIMIT" ]; then
        echo "***********************************************************************************************************"
        echo "NOTICE! Package has ${RDEP_COUNT} reverse build-dependencies."
        echo ""
        echo "Limiting to ${MAX_RDEP_LIMIT} in CI to avoid overloading the Salsa infrastructure."
        echo "If you need to test all reverse-dependencies, please run ratt locally on your machine."
        echo "***********************************************************************************************************"
      fi

      jq --argjson max_rdep_limit "$MAX_RDEP_LIMIT" -r '
        (.dry_run_builds // [])
        | sort_by([.package, .version, .sbuild_command])
        | .[:$max_rdep_limit][]
        | [.package, .version, .sbuild_command]
        | @tsv' /tmp/ratt_dry.json |
      while IFS=$'\t' read -r package version sbuild_command; do
        cat <<EOF >> "${WORKING_DIR}/build-rdeps-config.yml"

      build-rdep-${package}:
        extends: .rdep-build-definition
        stage: test
        variables:
          REVERSE_DEP: ${package}
        script:
          - su salsa-ci -c "${sbuild_command} --no-run-lintian --build-dir='${RDEP_BUILD_DIR}' --verbose"
        artifacts:
          paths:
            - ${RDEP_BUILD_DIR}
      EOF
      done
  artifacts:
    paths:
      - ${WORKING_DIR}/build-rdeps-config.yml
  needs:
    - job: build
      artifacts: true

.test-build-reverse-dependencies: &test-build-reverse-dependencies
  stage: test
  rules:
    - if: $SALSA_CI_ENABLE_BUILD_REVERSE_DEPENDENCIES =~ /^(1|yes|true)$/
    - if: $SALSA_CI_DISABLE_ALL_TESTS =~ /^(1|yes|true)$/
      when: never
    - if: $SALSA_CI_DISABLE_BUILD_REVERSE_DEPENDENCIES !~ /^(1|yes|true)$/
    - when: never
  needs:
    - job: generate-build-rdep-config
      optional: true
  trigger:
    include:
      - artifact: ${WORKING_DIR}/build-rdeps-config.yml
        job: generate-build-rdep-config
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID

.publish-aptly: &publish-aptly
  stage: publish
  image: $SALSA_CI_IMAGES_APTLY
  variables:
    GIT_STRATEGY: none
    REPO_PATH: 'aptly'
    PUBKEY_FILENAME: 'public-key.asc'
  rules:
    - if: $SALSA_CI_DISABLE_APTLY !~ /^(1|yes|true)$/
  script:
    - export REPO_URL="${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/${REPO_PATH}"
    - export REPO_PUBKEY_URL="${REPO_URL}/${PUBKEY_FILENAME}"
    - export GPG_TTY=$(tty)
    - export PUBKEY_BINARY_FILENAME=${PUBKEY_FILENAME%.asc}.gpg
    - aptly repo create -distribution ${RELEASE} -component main ${CI_PROJECT_NAME}
    # this can deal with multiple $WORKING_DIR* directories,
    # Thus, if one `needs:` more than just the build job, one can then insert additional packages.
    # One just has to make sure that each such job adds a differing suffix
    - for d in "${WORKING_DIR}"*; do aptly repo add ${CI_PROJECT_NAME} "$d"; done
    - aptly repo show -with-packages ${CI_PROJECT_NAME}
    - |
      if [ -n "${SALSA_CI_APTLY_GPG_KEY}" ]; then \
        echo "${SALSA_CI_APTLY_GPG_KEY}" \
        | gpg --import ${SALSA_CI_APTLY_GPG_PASSPHRASE:+ --batch --passphrase "${SALSA_CI_APTLY_GPG_PASSPHRASE}"}; \
      else \
        export SALSA_CI_APTLY_GPG_PASSPHRASE="${SALSA_CI_APTLY_GPG_PASSPHRASE:-${CI_PROJECT_NAME}:${CI_PIPELINE_ID}}"; \
        rngd -r /dev/urandom; \
        printf "Key-Type: RSA\nKey-Length: 2048\nName-Real: ${DEBFULLNAME}\nName-Email: ${DEBEMAIL}\nExpire-Date: 0\nPassphrase: ${SALSA_CI_APTLY_GPG_PASSPHRASE}\n%%commit" | \
        gpg --batch --gen-key; \
      fi
      gpg --export --armor > "${PUBKEY_FILENAME}"
      gpg --export > "${PUBKEY_BINARY_FILENAME}"
    - export INLINE_ARMORED_PUBKEY="$(sed 's/^$/./;s/^/ /' "${PUBKEY_FILENAME}")"
    - |
      ARCHITECTURES=$(aptly repo show -with-packages ${CI_PROJECT_NAME} | \
        awk 'BEGIN {FS="_"} /^Packages:/ {x=NR} (x && NR>x) {print $3}' | \
        sort -u | tr '\n' ','); \
        ARCHITECTURES=${ARCHITECTURES%,}; \
        aptly publish repo -batch \
        ${ARCHITECTURES:+ -architectures=${ARCHITECTURES}} \
        ${SALSA_CI_APTLY_GPG_PASSPHRASE:+ -passphrase="${SALSA_CI_APTLY_GPG_PASSPHRASE}"} \
        ${CI_PROJECT_NAME}
    - |
      mkdir -vp "${CI_PROJECT_DIR}/${REPO_PATH}"
        cp -av ~/.aptly/public/. "${CI_PROJECT_DIR}/${REPO_PATH}"
        mv "${PUBKEY_FILENAME}" "${CI_PROJECT_DIR}/${REPO_PATH}/${PUBKEY_FILENAME}"
        mv "${PUBKEY_BINARY_FILENAME}" "${CI_PROJECT_DIR}/${REPO_PATH}/${PUBKEY_BINARY_FILENAME}"
        envsubst < /etc/aptly/index.html.template > "${CI_PROJECT_DIR}/${REPO_PATH}/index.html"
    - |
      printf "APTLY_REPO=%s\nAPTLY_REPO_KEY_BASE64=%s\n" \
        "${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/jobs/${CI_JOB_ID}/artifacts/raw/${REPO_PATH}/ ${RELEASE} main" \
        "$(base64 -w0 ${CI_PROJECT_DIR}/${REPO_PATH}/${PUBKEY_BINARY_FILENAME})" \
        >> aptly.env
  artifacts:
    name: "$CI_JOB_NAME_SLUG:$CI_COMMIT_REF_SLUG"
    paths:
      - ${CI_PROJECT_DIR}/${REPO_PATH}
    reports:
      dotenv: aptly.env
  needs:
    - job: build
      artifacts: true
      optional: true
    - job: build i386
      artifacts: true
      optional: true
    - job: build armel
      artifacts: true
      optional: true
    - job: build armhf
      artifacts: true
      optional: true
    - job: build arm64
      artifacts: true
      optional: true
    - job: build ppc64el
      artifacts: true
      optional: true
    - job: build riscv64
      artifacts: true
      optional: true
